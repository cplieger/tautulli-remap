# Config for the shared image-smoke harness (tests/image-smoke.sh, synced from
# cplieger/ci). Resident-idle mode (REMAP_INTERVAL=off) reports healthy without
# dialing Plex or Tautulli, so dummy credentials satisfy config.Load. Healthy
# proves the binary runs in the distroless base and the health subcommand reads
# the file nonroot wrote. The root is read-only with no tmpfs (idle takes no
# run lock); smoke_verify fails on the degraded-mode warning, which health/v2
# logs when /dev/shm cannot hold the file and its probe would still pass.
SMOKE_APP_NAME=tautulli-remap
SMOKE_TIMEOUT=90
SMOKE_RUN_ARGS="--read-only -e TAUTULLI_API_KEY=dummy-smoke-key -e PLEX_TOKEN=dummy-smoke-token -e REMAP_INTERVAL=off"
# Logged after the first Set, so after any degraded-mode warning.
SMOKE_LOG_PATTERN='msg="resident-idle mode"'

SMOKE_LICENSE_TREE=1

smoke_verify() {
  logs=$(docker logs "$SMOKE_CONTAINER" 2>&1)
  case $logs in
    *'degraded mode'*)
      printf 'FAIL: the health file folder is not writable under --read-only\n' >&2
      return 1
      ;;
  esac
}
