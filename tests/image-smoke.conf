# Per-app config for the shared image-smoke harness (tests/image-smoke.sh,
# synced from cplieger/ci). Starts in resident-idle mode (REMAP_INTERVAL=off,
# also the default): main() sets the /tmp/.healthy marker and idles WITHOUT any
# network call (clients are constructed but Plex/Tautulli are dialed only on a
# trigger or in scheduled mode). Waits for the container HEALTHCHECK
# (["/tautulli-remap","health"]) to report healthy - proving the static binary
# runs in the distroless base, nonroot can write the marker, and the health
# subcommand works. config.Load requires non-empty TAUTULLI_API_KEY + PLEX_TOKEN
# (dummy values suffice; resident-idle never authenticates).
SMOKE_APP_NAME=tautulli-remap
SMOKE_TIMEOUT=90
SMOKE_RUN_ARGS="-e TAUTULLI_API_KEY=dummy-smoke-key -e PLEX_TOKEN=dummy-smoke-token -e REMAP_INTERVAL=off"

SMOKE_LICENSE_TREE=1
